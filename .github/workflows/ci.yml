name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  python-hooks:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Set up Node (the test suite runs the TypeScript harnesses)
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Byte-compile hooks and scripts
        run: python3 -m py_compile hooks/*.py scripts/*.py

      - name: Run unit tests
        run: python3 -m unittest discover -s tests -v
